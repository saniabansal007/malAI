<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LocalMind</title>
  <style>
    :root {
      --bg: #0f1318;
      --pn: #171d25;
      --ln: #2a3340;
      --tx: #e4e8ee;
      --mu: #8a96a6;
      --ac: #6fd3c0;
      --wa: #e8b86a
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      grid-template-columns: 200px 1fr 240px;
      background: var(--bg);
      color: var(--tx);
      font: 15px/1.55 "Segoe UI", system-ui, sans-serif
    }

    aside {
      background: var(--pn);
      padding: 16px;
      overflow: auto
    }

    aside.l {
      border-right: 1px solid var(--ln)
    }

    aside.r {
      border-left: 1px solid var(--ln)
    }

    h1 {
      font-size: 18px;
      margin: 0 0 16px
    }

    .btn-new {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      background: var(--pn);
      border: 1px solid var(--ln);
      color: var(--tx);
      padding: 9px 12px;
      border-radius: 8px;
      font: inherit;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .btn-new:hover {
      background: #222b36;
      border-color: var(--ac);
      color: #fff;
    }

    main {
      display: flex;
      flex-direction: column;
      min-width: 0
    }

    #log {
      flex: 1;
      overflow: auto;
      padding: 20px 24px
    }

    .m {
      max-width: 760px;
      margin: 0 auto 16px;
      word-wrap: break-word;
      line-height: 1.6;
    }

    .m.u {
      color: var(--ac);
      white-space: pre-wrap;
      background: rgba(111, 211, 192, 0.08);
      border: 1px solid rgba(111, 211, 192, 0.2);
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
    }

    .m:not(.u):not(.src) {
      color: var(--tx);
    }

    .m p {
      margin: 0 0 10px;
    }

    .m p:last-child {
      margin-bottom: 0;
    }

    .m ol,
    .m ul {
      margin: 8px 0 12px 24px;
      padding: 0;
    }

    .m li {
      margin-bottom: 6px;
      padding-left: 2px;
    }

    .m li > ul,
    .m li > ol {
      margin: 4px 0 6px 20px;
    }

    .m strong {
      color: #fff;
      font-weight: 600;
    }

    .m em {
      color: #c9d4e0;
    }

    .m h1,
    .m h2,
    .m h3,
    .m h4 {
      color: #fff;
      margin: 16px 0 8px;
      font-weight: 600;
    }

    .m h1 { font-size: 1.3em; }
    .m h2 { font-size: 1.15em; }
    .m h3 { font-size: 1.05em; }

    .m pre {
      background: #171d25;
      border: 1px solid var(--ln);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
      margin: 10px 0;
      white-space: pre;
    }

    .m code {
      background: #222b36;
      color: var(--ac);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: Consolas, monospace;
      font-size: 13px;
    }

    .m pre code {
      background: none;
      padding: 0;
      color: var(--tx);
    }

    .m blockquote {
      border-left: 3px solid var(--ac);
      margin: 10px 0;
      padding: 4px 14px;
      color: var(--mu);
      background: rgba(111, 211, 192, 0.05);
      border-radius: 0 6px 6px 0;
    }

    .m table {
      border-collapse: collapse;
      width: 100%;
      margin: 12px 0;
      font-size: 13.5px;
    }

    .m th,
    .m td {
      border: 1px solid var(--ln);
      padding: 8px 12px;
      text-align: left;
    }

    .m th {
      background: #222b36;
      color: #fff;
    }

    .cite-badge {
      display: inline-block;
      background: rgba(111, 211, 192, 0.15);
      color: var(--ac);
      border: 1px solid rgba(111, 211, 192, 0.35);
      padding: 1px 7px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.02em;
      margin: 0 2px;
      font-family: Consolas, monospace;
      vertical-align: baseline;
    }

    .src {
      font-size: 12px;
      color: var(--mu);
      border-left: 2px solid var(--ln);
      padding-left: 8px;
      margin: 4px 0;
    }

    form {
      display: flex;
      gap: 8px;
      padding: 14px 24px;
      border-top: 1px solid var(--ln)
    }

    input,
    textarea,
    button.go {
      background: var(--pn);
      border: 1px solid var(--ln);
      color: var(--tx);
      border-radius: 8px;
      padding: 10px;
      font: inherit
    }

    form input {
      flex: 1
    }

    button.go {
      background: var(--ac);
      color: #0b1512;
      border: 0;
      font-weight: 600;
      cursor: pointer
    }

    :focus-visible {
      outline: 2px solid var(--ac);
      outline-offset: 1px
    }

    .kv {
      display: flex;
      justify-content: space-between;
      font-family: Consolas, monospace;
      font-size: 13px;
      padding: 3px 0
    }

    .kv b {
      color: var(--ac)
    }

    .ag {
      max-width: 760px;
      margin: 0 auto 8px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px
    }

    .a {
      border: 1px solid var(--ln);
      border-radius: 8px;
      padding: 8px;
      font-size: 13px;
      color: var(--mu)
    }

    .a.running {
      border-color: var(--wa);
      color: var(--wa)
    }

    .a.done {
      border-color: var(--ac);
      color: var(--tx)
    }

    .pane {
      display: none
    }

    .pane.on {
      display: block
    }

    .box {
      max-width: 760px;
      margin: 0 auto
    }

    textarea {
      width: 100%;
      min-height: 120px
    }

    pre {
      white-space: pre-wrap;
      background: var(--pn);
      padding: 12px;
      border-radius: 8px
    }

    label {
      font-size: 13px;
      color: var(--mu)
    }

    @media(max-width:800px) {
      body {
        grid-template-columns: 1fr
      }

      aside {
        display: none
      }
    }
  </style>
</head>

<body>
  <aside class="l">
    <h1>LocalMind</h1>
    <div style="font-size:12px;color:var(--mu);margin-bottom:16px;line-height:1.5">
      Local banking AI assistant running fully private and offline.
    </div>
    <button id="newChat" class="btn-new">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      New Chat
    </button>
  </aside>
  <main>
    <div id="log"></div>
    <form id="f"><input id="q" placeholder="Ask anything…" autocomplete="off"><button class="go">Send</button></form>
  </main>
  <aside class="r">
    <h3 style="margin-top:0">SGLang live</h3>
    <div id="mt"></div>
  </aside>
  <script>
    let hist = []; const $ = s => document.querySelector(s), log = $("#log");
    $("#newChat").onclick = () => { hist = []; log.innerHTML = ""; };
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    function inlineMd(s) {
      s = esc(s);
      const codes = [];
      s = s.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
      s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      s = s.replace(/(^|[^*\w])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
      s = s.replace(/\[(POL-[A-Z0-9_-]+)\]/g, '<span class="cite-badge">$1</span>');
      s = s.replace(/\[(\d{1,2})\](?![\(\w])/g, '<span class="cite-badge">[$1]</span>');
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      return s.replace(/\u0000(\d+)\u0000/g, (_, i) => '<code>' + codes[i] + '</code>');
    }

    function renderMarkdown(src) {
      if (!src) return "";
      const lines = (src || '').replace(/\r/g, '').split('\n');
      const out = [];
      let i = 0;
      while (i < lines.length) {
        const l = lines[i];
        if (!l.trim()) { i++; continue; }

        // Code block
        if (/^```/.test(l)) {
          const buf = []; i++;
          while (i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
          i++;
          out.push('<pre><code>' + esc(buf.join('\n')) + '</code></pre>');
        }
        // Headings
        else if (/^#{1,4}\s/.test(l)) {
          const n = l.match(/^#+/)[0].length;
          out.push('<h' + n + '>' + inlineMd(l.replace(/^#+\s+/, '')) + '</h' + n + '>');
          i++;
        }
        // Blockquote
        else if (/^>\s?/.test(l)) {
          const buf = [];
          while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
          out.push('<blockquote>' + inlineMd(buf.join(' ')) + '</blockquote>');
        }
        // Tables
        else if (/^\|.+\|\s*$/.test(l) && /^\|[\s:|-]+\|\s*$/.test(lines[i + 1] || '')) {
          const row = r => r.trim().replace(/^\||\|$/g, '').split('|').map(c => inlineMd(c.trim()));
          const head = row(l); i += 2;
          const body = [];
          while (i < lines.length && /^\|.+\|\s*$/.test(lines[i])) body.push(row(lines[i++]));
          out.push('<table><thead><tr>' + head.map(c => '<th>' + c + '</th>').join('') + '</tr></thead><tbody>' +
                   body.map(r => '<tr>' + r.map(c => '<td>' + c + '</td>').join('') + '</tr>').join('') + '</tbody></table>');
        }
        // Lists (numbered or bullets with nested sub-items)
        else if (/^\s*(\d+\.|[-*])\s+/.test(l)) {
          const mList = l.match(/^(\s*)(\d+\.|[-*])\s+(.*)/);
          const baseIndent = mList[1].length;
          const isNum = /^\d+\./.test(mList[2]);
          const tag = isNum ? 'ol' : 'ul';
          const items = [];

          while (i < lines.length) {
            const cur = lines[i];
            if (!cur.trim()) {
              if (i + 1 < lines.length && /^\s*(\d+\.|[-*])\s+/.test(lines[i + 1])) {
                i++; continue;
              } else break;
            }
            const curM = cur.match(/^(\s*)(\d+\.|[-*])\s+(.*)/);
            if (!curM) {
              const curIndent = (cur.match(/^\s*/)[0] || '').length;
              if (curIndent > baseIndent && items.length) {
                items[items.length - 1] += '<br>' + inlineMd(cur.trim());
                i++; continue;
              } else break;
            }
            const curIndent = curM[1].length;
            const curIsNum = /^\d+\./.test(curM[2]);
            if (curIndent === baseIndent && curIsNum === isNum) {
              items.push(inlineMd(curM[3]));
              i++;
            } else if (curIndent > baseIndent) {
              const subTag = curIsNum ? 'ol' : 'ul';
              const subItems = [];
              const subIndent = curIndent;
              while (i < lines.length) {
                const sCur = lines[i];
                if (!sCur.trim()) { i++; continue; }
                const sM = sCur.match(/^(\s*)(\d+\.|[-*])\s+(.*)/);
                if (!sM || sM[1].length < subIndent) break;
                subItems.push('<li>' + inlineMd(sM[3]) + '</li>');
                i++;
              }
              if (items.length) {
                items[items.length - 1] += '<' + subTag + '>' + subItems.join('') + '</' + subTag + '>';
              } else {
                items.push('<' + subTag + '>' + subItems.join('') + '</' + subTag + '>');
              }
            } else break;
          }
          out.push('<' + tag + '>' + items.map(it => '<li>' + it + '</li>').join('') + '</' + tag + '>');
        }
        // Regular paragraph
        else {
          const buf = [];
          while (i < lines.length && lines[i].trim() && !/^(```|#{1,4}\s|>|\s*(\d+\.|[-*])\s+)/.test(lines[i])) {
            buf.push(lines[i++]);
          }
          out.push('<p>' + inlineMd(buf.join(' ')) + '</p>');
        }
      }
      return out.join('\n');
    }

    function add(cls, t) {
      const d = document.createElement("div");
      d.className = "m " + cls;
      if (cls === "u" || cls.includes("src")) {
        d.textContent = t;
      } else if (t) {
        d.innerHTML = renderMarkdown(t);
      }
      log.append(d);
      log.scrollTop = 1e9;
      return d;
    }
    async function sse(url, body, on) {
      const r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const rd = r.body.getReader(), dc = new TextDecoder(); let buf = "";
      while (true) {
        const { done, value } = await rd.read(); if (done) break; buf += dc.decode(value); const parts = buf.split("\n\n"); buf = parts.pop();
        for (const p of parts) if (p.startsWith("data: ")) on(JSON.parse(p.slice(6)))
      }
    }
    $("#f").onsubmit = async e => {
      e.preventDefault(); const q = $("#q").value.trim(); if (!q) return; $("#q").value = ""; add("u", q);
      const out = add("", ""); let txt = "";
      const tok = ev => {
        if (ev.t == "tok") {
          txt += ev.v;
          out.innerHTML = renderMarkdown(txt);
          log.scrollTop = 1e9;
        }
      };
      try {
        hist.push({ role: "user", content: q });
        await sse("/api/chat", { messages: hist, docs: false }, ev => {
          tok(ev);
        });
        hist.push({ role: "assistant", content: txt });
      } catch (err) {
        out.innerHTML = "<span style='color:var(--wa)'>Could not reach the model. Is SGLang running on port 30000?</span>";
      }
    };
    async function met() {
      try {
        const m = await (await fetch("/api/metrics")).json(); const row = (k, v) => `<div class="kv"><span>${k}</span><b>${v ?? "–"}</b></div>`;
        $("#mt").innerHTML = row("Server", m.up ? "online" : "offline") + row("Tokens/s", m.tps) + row("Server gen/s", m.gen_tps) + row("Cache hit", m.cache != null ? (m.cache * 100).toFixed(0) + "%" : null) + row("Running", m.running) + row("Queued", m.queued) + row("Tokens total", m.tokens)
      } catch { }
    }
    setInterval(met, 1500); met();
  </script>
</body>

</html>
