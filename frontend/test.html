<!doctype html>
<html>
<head>
  <script src="/js/marked.min.js"></script>
</head>
<body>
  <div id="res"></div>
  <script>
    const el = document.getElementById("res");
    try {
      const type = typeof marked;
      let parseRes = "";
      if (typeof marked !== "undefined") {
        if (typeof marked.parse === "function") {
          parseRes = marked.parse("1. **Demat Account**: An account");
        } else if (typeof marked === "function") {
          parseRes = marked("1. **Demat Account**: An account");
        } else {
          parseRes = "marked is not callable: " + Object.keys(marked).join(",");
        }
      }
      el.innerHTML = "TYPE:" + type + " | RES:" + parseRes;
    } catch (err) {
      el.innerHTML = "ERR:" + err.message + "\n" + err.stack;
    }
  </script>
</body>
</html>
